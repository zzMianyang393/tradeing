# 策略参数配置

# 热门币种筛选
hot_coins:
  top_n: 18                    # 热门币数量
  refresh_interval: 3600       # 刷新间隔（秒）
  min_volume_usdt: 1000000     # 最小24h成交额(USDT)
  blacklist: ["USDC", "BUSD", "TUSD"]  # 排除稳定币

# 技术指标参数
indicators:
  ema:
    fast: 9
    medium: 21
    slow: 55
  rsi:
    period: 14
    overbought: 70
    oversold: 30
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    period: 20
    std: 2
  atr:
    period: 14
  volume_sma:
    period: 20
    spike_threshold: 1.5  # 放量倍数
  stoch_rsi:
    period: 14
    smooth_k: 3
    smooth_d: 3

# 规则信号
rules:
  min_conditions: 2       # trend_4h_filter: RSI极值 + 成交量确认（2个条件全部满足）
  min_conditions_strict: 6
  long_conditions_min: 0
  direction_mode: "both"
  strategy_mode: "trend_4h_filter"  # 4小时趋势过滤策略（已验证 60% WR, +25U/83天）

# ADX 趋势强度过滤
adx:
  period: 14
  threshold: 20  # ADX < 20 视为震荡市场，不交易

# ML 模型
ml:
  enabled: false           # false = 纯规则交易；true = ML只作为过滤器
  mode: "filter"           # filter=只过滤；advisor=预测幅度并参与TP/SL和持仓管理
  train_days: 90           # 训练数据天数
  retrain_interval: 604800 # 重新训练间隔（秒，7天）
  predict_horizon: 4       # 预测未来N根K线
  confidence_threshold: 0.3 # 置信度阈值
  min_expected_return: 0.001 # 至少预测+0.1%净收益才通过
  min_win_prob: 0.55       # 至少55%胜率才通过
  take_profit_capture: 0.8 # 预测幅度的80%作为动态止盈参考
  reversal_exit_prob: 0.55 # 持仓中反向概率超过该值且有利润时平仓
  protect_profit_pct: 0.003 # 盈利超过0.3%但趋势走弱时保护到保本
  fee_rate: 0.0005         # 单边taker手续费估算
  slippage: 0.001          # 单边滑点估算
  model_path: "data/ml_model.pkl"

# 风控参数
risk:
  max_position_pct: 0.02       # 单笔最大亏损占总资金比例（2%）
  max_concurrent_positions: 2  # 最大同时持仓数
  max_daily_loss: 0.08         # 日最大亏损比例(8%)
  min_risk_reward: 1.5         # 最小盈亏比
  kelly_fraction: 0.5          # 凯利分数（半凯利）
  min_position_pct: 0.15       # 最小仓位比例（15%）
  max_position_pct_cap: 0.30   # 最大仓位比例（30%）
  min_trades_for_kelly: 10     # 凯利公式最少交易数（warmup）

# 杠杆设置 — 程序根据信号强度在min~max之间动态选择
leverage:
  min: 3
  max: 5
  signal_thresholds:
    strong: 0.8    # 信号强度>0.8 → 接近max
    medium: 0.6    # 信号强度>0.6 → 中间值
    weak: 0.4      # 信号强度<0.4 → 接近min

# 止损策略 (已优化: SL=1.5% + 4h趋势过滤, 60% WR验证通过)
stop_loss:
  max_pct: 0.015
  fixed_pct: 0.015
  trailing_activate: 0
  trailing_callback: 0
  trailing_long_only: false

# 止盈策略 (已优化: TP=1.5% 1:1盈亏比)
take_profit:
  fixed_pct: 0.015
  risk_reward_ratio: 1.0
  partial_close_pct: 0
  partial_close_trigger: 0
